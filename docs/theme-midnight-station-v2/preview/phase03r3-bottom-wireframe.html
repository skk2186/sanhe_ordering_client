<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phase03-R3 bottom wireframe</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}
    body{display:grid;place-items:center}.canvas{width:3840px;height:1080px;position:relative;background:linear-gradient(#07111d 0 72%,#17221f 72%)}
    .caption{position:absolute;left:0;right:0;top:650px;text-align:center;font-size:30px;color:#f2c978}.bottom{position:absolute;left:350px;right:350px;bottom:24px;height:340px;display:grid;grid-template-columns:1050px 900px 1050px;gap:70px;align-items:end}
    .facility{height:320px;position:relative;border:4px solid #d6a551;background:rgba(28,86,72,.24)}
    .cart{display:grid;grid-template-columns:repeat(4,1fr) 1.32fr;gap:14px;padding:20px}.cart.right{grid-template-columns:1.32fr repeat(4,1fr)}
    .slot,.order,.control{border:3px solid rgba(255,255,255,.86);background:rgba(47,139,121,.22)}
    .slot{display:grid;grid-template-rows:55% 18% 27%;min-width:0}.image{display:grid;place-items:center;font-size:24px;background:rgba(88,153,255,.25)}.image::before{content:"商品图 118×118";display:grid;place-items:center;width:118px;height:118px;border:3px dashed #84b8ff;border-radius:50%}
    .name{display:grid;place-items:center;font-size:21px;background:rgba(255,216,112,.22)}.controls{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;padding:8px}.controls button{height:52px;border:3px solid #f2c978;background:rgba(217,155,74,.28);color:#fff;font-size:36px}.quantity{text-align:center;font-size:28px}
    .order{display:grid;grid-template-rows:58% 20% 22%;padding:12px;gap:9px;background:rgba(160,72,72,.2)}.preview{display:grid;place-items:center;font-size:22px}.preview::before{content:"订单预览 108×108";display:grid;place-items:center;width:108px;height:108px;border:3px dashed #ff9696;border-radius:8px}.orderline{display:grid;grid-template-columns:1fr 1fr;place-items:center;font-size:26px}.total{display:grid;place-items:center;font-size:26px;border:3px solid #f2c978}
    .center{display:grid;grid-template-columns:180px 1fr 180px;gap:16px;padding:20px}.menu,.center button{border:3px solid #f2c978;background:rgba(217,155,74,.18);color:#fff;font-size:28px;font-weight:700}.core{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}.core button{font-size:25px}.tag{position:absolute;top:-42px;left:0;right:0;text-align:center;font-size:26px;color:#f2c978}
  </style>
</head>
<body>
<main class="canvas">
  <div class="caption">Phase03-R3 · interaction-first wireframe · 3840 × 1080</div>
  <section class="bottom">
    <div class="facility cart left"><span class="tag">LEFT CART</span>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">2</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
      <div class="order"><div class="preview"></div><div class="orderline"><b>下单</b><b>2/4</b></div><div class="total">¥ 18.00</div></div>
    </div>
    <div class="facility center"><span class="tag">CENTER CONSOLE</span><button class="menu">菜单</button><div class="core"><button>导航 / 搜索</button><button>点餐记录</button><button>系统设置</button><button>呼叫店员</button></div><button class="menu">菜单</button></div>
    <div class="facility cart right"><span class="tag">RIGHT CART</span>
      <div class="order"><div class="preview"></div><div class="orderline"><b>下单</b><b>2/4</b></div><div class="total">¥ 18.00</div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">2</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
      <div class="slot"><div class="image"></div><div class="name">商品名称</div><div class="controls"><button>−</button><div class="quantity">1</div><button>+</button></div></div>
    </div>
  </section>
</main>
</body>
</html>
