<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight Station V2 · 3840×1080 布局校验</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #07111d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050a10; }
    .frame {
      position: relative;
      width: min(100vw, calc(100vh * 32 / 9));
      aspect-ratio: 32 / 9;
      overflow: hidden;
      background: #07111d url("../../public/images/ui/midnight-station/background-v2.png") center / 100% 100% no-repeat;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .55);
    }
    .zone {
      position: absolute;
      border: max(1px, .055vw) solid currentColor;
      background: color-mix(in srgb, currentColor 10%, transparent);
      color: #f2c978;
      pointer-events: none;
    }
    .zone span {
      position: absolute;
      left: .35vw;
      top: .25vw;
      padding: .18vw .34vw;
      border-radius: .16vw;
      color: #07111d;
      background: currentColor;
      font-size: clamp(7px, .5vw, 19px);
      font-weight: 800;
      white-space: nowrap;
    }
    .top { inset: 0 0 auto; height: 18.15%; color: #75b9d4; }
    .middle { inset: 18.15% 0 auto; height: 62.13%; color: #f2c978; }
    .bottom { inset: 80.28% 0 0; color: #d88975; }
    .brand { left: .63%; top: 1.3%; width: 25.5%; height: 15.5%; color: #83c9b4; }
    .progress { left: 37.73%; top: .75%; width: 24.5%; height: 9.5%; color: #f2c978; }
    .assistant { right: .73%; top: 1.3%; width: 34%; height: 15.5%; color: #b7a3e1; }
    .motion { left: .47%; top: 25.9%; width: 99.06%; height: 39%; color: #83c9b4; }
    .categories { left: 29.7%; top: 74.5%; width: 40.6%; height: 5.7%; color: #75b9d4; }
    .cart-left { left: 17.4%; top: 80.28%; width: 21.54%; height: 19.72%; color: #d88975; }
    .console { left: 39.72%; top: 80.28%; width: 20.58%; height: 19.72%; color: #f2c978; }
    .cart-right { left: 61.07%; top: 80.28%; width: 21.54%; height: 19.72%; color: #d88975; }
    .rail-guide {
      position: absolute;
      left: 0;
      right: 0;
      top: 34.5%;
      height: 8.8%;
      border-block: max(1px, .055vw) dashed rgba(255, 255, 255, .8);
      background: rgba(22, 112, 95, .1);
      pointer-events: none;
    }
    .rail-guide span {
      position: absolute;
      right: .5vw;
      bottom: .3vw;
      color: #e5d7bc;
      font-size: clamp(7px, .48vw, 18px);
      font-weight: 700;
    }
    .note {
      position: fixed;
      left: 16px;
      bottom: 12px;
      margin: 0;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="3840×1080 母背景与实际组件区域校验图">
    <div class="zone top"><span>顶部 196px</span></div>
    <div class="zone middle"><span>主舞台约 671px</span></div>
    <div class="zone bottom"><span>底部 213px</span></div>
    <div class="zone brand"><span>品牌 / 桌号</span></div>
    <div class="zone progress"><span>投碟进度</span></div>
    <div class="zone assistant"><span>AI 助手 / 推荐</span></div>
    <div class="zone motion"><span>菜品横向运动区</span></div>
    <div class="zone categories"><span>分类 / 暂停</span></div>
    <div class="zone cart-left"><span>左购物车</span></div>
    <div class="zone console"><span>中央功能台</span></div>
    <div class="zone cart-right"><span>右购物车</span></div>
    <div class="rail-guide"><span>背景配送轨道对齐带</span></div>
  </main>
  <p class="note">仅用于设计校验；不参与 Vue 构建，不含业务逻辑。</p>
</body>
</html>
