<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" role="img" aria-labelledby="title desc">
  <title id="title">Theme V4 两场景共用构图与送餐台净空区</title>
  <desc id="desc">3840 乘 1080 母版的等比示意。主题物件集中在上方与两端，送餐台、菜品和底部功能区域保持净空。</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#f7f2e9"/><stop offset="1" stop-color="#e8ece8"/></linearGradient>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#e5f1ed"/></linearGradient>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#acb7b2" stroke-width="1" opacity=".22"/></pattern>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#263a36}
      .kicker{font-size:20px;font-weight:700;letter-spacing:4px;fill:#627671}
      .title{font-size:47px;font-weight:800}
      .sub{font-size:24px;fill:#64736e}
      .zone{font-size:25px;font-weight:700}
      .small{font-size:21px;fill:#52635e}
      .mini{font-size:18px;fill:#60736c}
      .tag{font-size:22px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1920" height="1100" fill="#f4f5f0"/>
  <text x="60" y="64" class="kicker">SANHE ORDERING · THEME V4 · 01</text>
  <text x="60" y="123" class="title">先锁住送餐台，再设计场景</text>
  <text x="1270" y="120" class="sub">共用骨架 · 3840 × 1080 母版</text>

  <!-- The complete frame is a 0.46875 scale view of the 3840 x 1080 canvas. -->
  <g transform="translate(60 165) scale(.46875)">
    <rect width="3840" height="1080" rx="25" fill="url(#page)" stroke="#50645d" stroke-width="6"/>
    <rect width="3840" height="1080" rx="25" fill="url(#grid)"/>
    <rect x="0" y="0" width="3840" height="196" fill="#d7e2db" opacity=".8"/>
    <rect x="0" y="865" width="3840" height="215" fill="#dce4df" opacity=".94"/>
    <path d="M0 196H3840M0 865H3840" stroke="#7c9188" stroke-width="4" stroke-dasharray="16 14"/>

    <!-- Theme cues may live in the back wall and at the outer edges. -->
    <rect x="70" y="214" width="3700" height="144" rx="30" fill="#e8d6b5" opacity=".62" stroke="#bd9c68" stroke-width="3" stroke-dasharray="18 12"/>
    <rect x="42" y="358" width="340" height="420" rx="30" fill="#e8d6b5" opacity=".48" stroke="#bd9c68" stroke-width="3" stroke-dasharray="18 12"/>
    <rect x="3458" y="358" width="340" height="420" rx="30" fill="#e8d6b5" opacity=".48" stroke="#bd9c68" stroke-width="3" stroke-dasharray="18 12"/>
    <text x="690" y="290" class="zone">场景识别带：窗景 / 屋檐 / 海平线 / 遮阳棚</text>
    <text x="65" y="524" class="zone" transform="rotate(-90 65 524)">边缘装饰</text>
    <text x="3760" y="524" class="zone" transform="rotate(90 3760 524)">边缘装饰</text>

    <!-- Existing UI over the art remains clear. -->
    <rect x="36" y="24" width="3768" height="145" rx="22" fill="#fff" opacity=".76" stroke="#7c9188" stroke-width="3"/>
    <text x="95" y="104" class="zone">品牌与桌号</text>
    <text x="1670" y="104" class="zone">投碟进度</text>
    <text x="3190" y="104" class="zone">语音助手</text>

    <!-- Keep the plate and label corridor free of scene foreground. -->
    <rect x="390" y="365" width="3060" height="415" rx="42" fill="url(#stage)" stroke="#197a77" stroke-width="9"/>
    <rect x="420" y="390" width="3000" height="360" rx="30" fill="none" stroke="#197a77" stroke-width="3" stroke-dasharray="18 13"/>
    <text x="1135" y="495" style="font-size:62px;font-weight:800;fill:#146b69">送餐台与菜品净空区</text>
    <text x="1110" y="563" style="font-size:34px;fill:#315955">只放餐台、动态餐盘、菜名、价格和必要控件</text>
    <text x="1160" y="615" style="font-size:29px;fill:#47716b">场景装饰、猫身、前景贴图不得压入</text>
    <path d="M535 682C1200 630 2640 630 3305 682" fill="none" stroke="#40948c" stroke-width="13" stroke-linecap="round"/>
    <path d="m3276 656 39 27-42 22" fill="none" stroke="#40948c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cat marks are provisional composition slots, not approved asset anchors. -->
    <g fill="#9a755a" stroke="#654b3d" stroke-width="5">
      <circle cx="530" cy="302" r="48"/><circle cx="1920" cy="302" r="48"/><circle cx="3310" cy="302" r="48"/>
    </g>
    <g class="zone" text-anchor="middle"><text x="530" y="323" fill="#fff">猫 1</text><text x="1920" y="323" fill="#fff">猫 2</text><text x="3310" y="323" fill="#fff">猫 3</text></g>
    <text x="205" y="824" class="small">猫咪固定在台后；足部接触和遮挡关系留待静帧验证</text>
    <rect x="668" y="865" width="827" height="215" rx="22" fill="#f9faf7" stroke="#6e8d83" stroke-width="4"/>
    <rect x="1525" y="865" width="790" height="215" rx="22" fill="#f9faf7" stroke="#6e8d83" stroke-width="4"/>
    <rect x="2345" y="865" width="827" height="215" rx="22" fill="#f9faf7" stroke="#6e8d83" stroke-width="4"/>
    <text x="1079" y="988" class="zone" text-anchor="middle">左购物区</text>
    <text x="1920" y="988" class="zone" text-anchor="middle">中央功能区</text>
    <text x="2758" y="988" class="zone" text-anchor="middle">右购物区</text>
  </g>

  <text x="60" y="732" class="kicker">SCENE CUES · 每场景仅用少量强识别元素</text>
  <g transform="translate(60 755)">
    <rect width="870" height="218" rx="24" fill="#fff8f3" stroke="#d8c3b5" stroke-width="2"/>
    <rect x="20" y="20" width="12" height="178" rx="6" fill="#db8c9e"/>
    <text x="55" y="61" style="font-size:34px;font-weight:800">A · 樱花寿司屋</text>
    <text x="55" y="108" class="small">樱花枝 + 木屋檐 + 暖灯笼</text>
    <text x="55" y="151" class="mini">识别物位于窗景、屋檐和两端；台面保持干净。</text>
    <circle cx="765" cy="78" r="39" fill="#f2bdc9"/><path d="M710 160q55-90 107-40" fill="none" stroke="#9a6c67" stroke-width="12"/>
  </g>
  <g transform="translate(990 755)">
    <rect width="870" height="218" rx="24" fill="#f3faf8" stroke="#b5d3cc" stroke-width="2"/>
    <rect x="20" y="20" width="12" height="178" rx="6" fill="#4eacae"/>
    <text x="55" y="61" style="font-size:34px;font-weight:800">B · 海边寿司屋</text>
    <text x="55" y="108" class="small">海平线 + 遮阳棚 + 极少海浪</text>
    <text x="55" y="151" class="mini">识别物位于远景和顶部；不画浪花盖住菜品。</text>
    <path d="M700 140q35-18 70 0t70 0" fill="none" stroke="#59aeba" stroke-width="12"/><circle cx="765" cy="72" r="35" fill="#f3c888"/>
  </g>
  <text x="60" y="1031" class="sub">定位原则：先按真实页面测量修订净空边界，再制作美术；猫咪圆点仅表示工位，不是最终素材坐标。</text>
</svg>
